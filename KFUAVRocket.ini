[UAVRocket.KFWeap_Minimap]
UAVCost=700
EnableMinimapCrosshair=true
CrosshairColor=(R=255,G=255,B=255,A=255)
SelfDamageReductionValue=0.06f

[UAVRocket.KFProj_Trace_Minimap]
UAVRocketAmount=1 // The amount of rockets to spawn
RocketRing=2000 // ring where rockets spawn to give it that slightly tilted(towers) landing aproach
UAVRocketSpawnOffsetZ=20000 // 2 kilometers
UAVRocketSpeed=6200
RoofCheckDistance=2500 // 25 meters (this will check for roof and if there is one were trace landed in will not spawn UAV Rocket)

[UAVRocket.KFProj_Rocket_UAV]
EnableUAVSpotlight=true // Enables or Disables spotlight that is attached to rocket
LaserActive=false // Experimental really even tho it works for the most part
ExplosionDamage=800
ExplosionRadius=1500